<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hautlieu Chad Rankings</title>
<style>
:root{--bg:#050b24;--nav:#0a1646;--surf:#0e1d57;--bd:#2c4a9a;--text:#eaf1ff;--muted:#8fa6dc;--line:#183073;--gold:#e8c46a;--good:#4de0b0;--bad:#ff6b85}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.ico{flex:none;vertical-align:-3px}
main{max-width:760px;margin:0 auto;padding:40px 20px 120px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.sub,.muted{color:var(--muted);font-size:13px}
.sub{margin:4px 0 28px}
#boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);font-size:14px;transition:opacity .3s}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot.done{opacity:0;pointer-events:none}
.ticker{overflow:hidden;white-space:nowrap;font-size:12px;color:var(--muted);padding:7px 0;background:var(--nav);border-bottom:1px solid var(--line)}
.ticker-track{display:inline-flex;gap:60px;animation:scroll 40s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
header{background:var(--nav);border-bottom:1px solid var(--line)}
.head-in{max-width:760px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px}
nav{display:flex;gap:18px}
nav a{color:var(--muted);font-weight:600;font-size:14px;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);border-color:var(--text)}
.avatar{position:relative;display:grid;place-items:center;overflow:hidden;width:44px;height:44px;border-radius:50%;background:var(--surf);border:1px solid var(--bd);font-weight:700;flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mv{display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:12px;width:36px}
.mv.up{color:var(--good)}.mv.down{color:var(--bad)}.mv.flat{color:var(--muted)}
.score{font-weight:700;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--nav)}
.row .pos{width:24px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.row:first-child .pos{color:var(--gold)}
.info{flex:1;min-width:0}
.name{font-weight:600}
.title{color:var(--muted);font-size:13px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:20px}
.back:hover{color:var(--text)}
.profile{text-align:center;padding:10px 0}
.profile .avatar{width:120px;height:120px;font-size:40px;margin:0 auto 16px}
.big-score{font-size:56px;font-weight:700;line-height:1;margin-top:18px}
.big-score span{font-size:16px;color:var(--muted);font-weight:500}
.meter{height:4px;max-width:260px;margin:14px auto 24px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--text)}
.desc{color:#c3cde8;white-space:pre-wrap;margin:18px auto 22px;max-width:520px}
.stats{display:flex;justify-content:center;gap:28px;margin:6px 0 18px;font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:20px;color:var(--text)}
.news-card{padding:20px 0;border-bottom:1px solid var(--line)}
.news-card h2{font-size:20px;margin:4px 0 6px}
.news-card p{color:#c3cde8;white-space:pre-wrap}
.news-card img{width:100%;max-height:340px;object-fit:cover;border-radius:6px;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{padding:18px 14px;text-align:center;border:1px solid var(--line);border-radius:8px}
.tile .avatar{width:80px;height:80px;font-size:28px;margin:0 auto 10px}
.tile .name{display:block}
.pts{margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pts b{color:var(--text);font-size:16px}
.vote-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile .status{margin-top:8px;font-size:12px;min-height:18px;color:var(--muted)}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--text);color:#050b24;border:0;border-radius:6px;padding:9px 14px;font:600 13px/1.4 inherit;cursor:pointer}
button:hover:not(:disabled){opacity:.85}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--bd)}
.vote-btns .picked-yes{background:var(--good);color:#050b24;border-color:var(--good);opacity:1!important}
.vote-btns .picked-no{background:var(--bad);color:#050b24;border-color:var(--bad);opacity:1!important}
#adminbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;max-width:94vw}
#adminbar:empty{display:none}
dialog{width:min(720px,94vw);max-height:88vh;overflow:auto;padding:22px;color:var(--text);background:var(--surf);border:1px solid var(--bd);border-radius:12px;margin:auto}
dialog::backdrop{background:rgba(3,7,20,.75)}
input,textarea{width:100%;padding:9px 12px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--bd);border-radius:6px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 4px}
.editor-card{padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px}
.editor-card input,.editor-card textarea{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:90px 90px 1fr;gap:6px}
.editor-foot{display:flex;justify-content:space-between;align-items:center}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr}.grid3 input:last-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.spin{animation:spin 2s linear infinite!important}}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><span id="bootmsg">Loading…</span></div>
<div class="ticker"><div class="ticker-track" id="ticker"></div></div>
<header><div class="head-in">
  <div class="logo">Hautlieu Chad Rankings</div>
  <nav>
    <a href="#rankings" data-route="rankings">Rankings</a>
    <a href="#news" data-route="news">News</a>
    <a href="#vote" data-route="vote">Vote</a>
  </nav>
</div></header>
<main id="app"></main>
<footer>© Hautlieu Chad Rankings</footer>
<div id="adminbar"></div>
<dialog id="dlg"></dialog>

<script id="data" type="application/json">
{
  "passHash": null,
  "ticker": "Welcome to Hautlieu Chad Rankings — standings published every cycle",
  "board": [
    {"id":"dean","n":"Dean","t":"Current True Adam","m":1,"s":98,"desc":"Professional Unfunnyman","img":"https://files.catbox.moe/expnk6.png"},
    {"id":"toby","n":"Toby","t":"Girl Farmer","m":-1,"s":95,"desc":"Girl Farmer","img":"https://files.catbox.moe/cqu3lf.jpg"},
    {"id":"adam","n":"Adam","t":"Nice Guy","m":0,"s":94,"desc":"Nice Guy","img":"https://files.catbox.moe/3aegtk.jpg"},
    {"id":"sizu","n":"Sizu","t":"Classic Chad","m":0,"s":92,"desc":"Classic Chad","img":"https://files.catbox.moe/t8x9cn.jpg"},
    {"id":"alek","n":"Alek","t":"True Fouler","m":0,"s":91,"desc":"True Fouler","img":"https://files.catbox.moe/5ptud2.jpg"},
    {"id":"ethan","n":"Ethan","t":"Roblox Studio Prodigy","m":0,"s":90,"desc":"Roblox Studio Prodigy","img":"https://files.catbox.moe/rayn8o.jpg"},
    {"id":"charlie","n":"Charlie","t":"Jonification Continuer","m":0,"s":88,"desc":"Jonification Continuer","img":"https://files.catbox.moe/pr8rix.jpg"},
    {"id":"kordian","n":"Kordian","t":"Tuff Man","m":0,"s":80,"desc":"Tuff man","img":"https://files.catbox.moe/u1ouy0.png"},
    {"id":"samuel","n":"Samuel","t":"Shamus The Third","m":0,"s":79,"desc":"Shamus The Third","img":"https://files.catbox.moe/kzh3l8.jpg"},
    {"id":"ellis","n":"Ellis","t":"Ellisian","m":0,"s":76,"desc":"Ellisian","img":"https://files.catbox.moe/3p9fwk.jpg"},
    {"id":"harry","n":"Harry","t":"Chill guy","m":0,"s":75,"desc":"Chill guy","img":"https://files.catbox.moe/mtwbvz.jpg"}
  ],
  "news":[
    {"h":"DEAN LOCKED IN?!","b":"Dean recently brutally mogged Toby and is now the currrent true adam","img":"https://files.catbox.moe/6wrfe5.png","d":"2026-10-23"}
  ],
  "poll":{"id":"p1","q":"Is this contender a Chad? Cast your verdict on each one."}
}
</script>

<script>
const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'c'+Math.random().toString(36).slice(2,8);
let S=JSON.parse($('#data').textContent);
let isAdmin=false;
let T={}; // community tally: {contenderId:{c:chadVotes,n:notChadVotes}}

const normalise=()=>S.board.forEach(p=>{p.id=p.id||uid();p.s=p.s??0;p.desc=p.desc??''});
normalise();

const PATHS={
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  minus:'<path d="M5 12h14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'
};
const icon=(name,size=16)=>`<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]||''}</svg>`;

/* Image preloading: every image is fetched once before the site shows,
   and the Image objects are kept so the browser cache holds them. */
const imgCache=new Map();
function preload(urls){
  return Promise.all([...new Set(urls.filter(Boolean))].filter(u=>!imgCache.has(u)).map(u=>new Promise(res=>{
    const im=new Image();
    imgCache.set(u,im);
    im.onload=()=>(im.decode?im.decode().catch(()=>{}):Promise.resolve()).then(res);
    im.onerror=res;
    im.src=u;
  })));
}
const allImages=()=>[...S.board.map(p=>p.img),...S.news.map(n=>n.img)];
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);

/* Community points: Chad vote = +1, Not Chad vote = -1 */
const pts=id=>{const t=T[id]||{c:0,n:0};return{c:t.c,n:t.n,pts:t.c-t.n,total:t.c+t.n}};
async function loadTally(){
  try{
    const r=await fetch('/api/vote?poll='+encodeURIComponent(S.poll.id));
    if(r.ok)T=(await r.json()).tally||{};
  }catch{}
}

const avatar=p=>`<div class="avatar"><span>${esc((p.n.trim()[0]||'?').toUpperCase())}</span>${p.img?`<img src="${esc(p.img)}" alt="" onerror="this.remove()">`:''}</div>`;
const movement=m=>m>0?`<span class="mv up">${icon('up',12)}${m}</span>`:m<0?`<span class="mv down">${icon('down',12)}${Math.abs(m)}</span>`:`<span class="mv flat">${icon('minus',12)}</span>`;

function rankingsView(){
  return `<h1>Rankings</h1><p class="sub">Standings reviewed and published every cycle.</p>`+
    S.board.map((p,i)=>`<a class="row" href="#profile/${p.id}">
      <div class="pos">${i+1}</div>${avatar(p)}
      <div class="info"><div class="name">${esc(p.n)}</div><div class="title">${esc(p.t)}</div></div>
      ${movement(p.m)}<span class="score">${p.s}</span></a>`).join('');
}

const newsView=()=>`<h1>News</h1><p class="sub">Latest from the association.</p>`+
  S.news.map(n=>`<article class="news-card">
    <div class="muted">${esc(n.d)}</div><h2>${esc(n.h)}</h2><p>${esc(n.b)}</p>
    ${n.img?`<img src="${esc(n.img)}" alt="" onerror="this.remove()">`:''}</article>`).join('');

function profileView(id){
  const i=S.board.findIndex(p=>p.id===id);
  if(i<0)return `<a class="back" href="#rankings">${icon('back')} Rankings</a><h1>Profile not found</h1>`;
  const p=S.board[i],c=pts(id);
  return `<a class="back" href="#rankings">${icon('back')} Rankings</a>
    <div class="profile">${avatar(p)}
      <div class="muted">Rank #${i+1}</div>
      <h1>${esc(p.n)}</h1><div class="title">${esc(p.t)}</div>
      <div style="margin-top:8px">${movement(p.m)}</div>
      <div class="big-score">${p.s}<span> /100</span></div>
      <div class="meter"><i style="width:${p.s}%"></i></div>
      <div class="stats"><div><b>${c.pts>0?'+':''}${c.pts}</b>community points</div><div><b>${c.c}</b>Chad</div><div><b>${c.n}</b>Not Chad</div></div>
      <p class="desc">${esc(p.desc)||'No description yet.'}</p>
      <button class="ghost" data-copy="${p.id}">${icon('link')} Copy profile link</button>
    </div>`;
}

const voteKey=id=>`v_${S.poll.id}_${id}`;
const ptsHTML=id=>{const c=pts(id);return `<b>${c.pts>0?'+':''}${c.pts}</b> points · ${c.total} vote${c.total===1?'':'s'}`};

function tileHTML(p){
  const v=localStorage.getItem(voteKey(p.id));
  const result=v?`${icon(v==='c'?'check':'x',14)} You voted ${v==='c'?'Chad':'Not Chad'}`:'';
  return `<div class="tile" data-id="${p.id}">
    ${avatar(p)}
    <a class="name" href="#profile/${p.id}">${esc(p.n)}</a>
    <div class="title">${esc(p.t)}</div>
    <div class="pts">${ptsHTML(p.id)}</div>
    <div class="vote-btns">
      <button data-v="c" class="${v==='c'?'picked-yes':'ghost'}" ${v?'disabled':''}>${icon('check',14)} Chad</button>
      <button data-v="n" class="${v==='n'?'picked-no':'ghost'}" ${v?'disabled':''}>${icon('x',14)} Not Chad</button>
    </div>
    <div class="status">${result}</div>
  </div>`;
}

const voteView=()=>`<h1>Vote</h1><p class="sub">${esc(S.poll.q)} Chad = +1 point, Not Chad = −1.</p>
  <div class="tiles">${S.board.map(tileHTML).join('')}</div>`;

const VIEWS={rankings:rankingsView,news:newsView,vote:voteView};

function route(){
  const hash=location.hash.slice(1)||'rankings';
  const profile=hash.match(/^profile\/(.+)$/);
  const key=profile?'rankings':(VIEWS[hash]?hash:'rankings');
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.route===key));
  $('#app').innerHTML=profile?profileView(profile[1]):VIEWS[key]();
  if(!isAdmin||profile)scrollTo(0,0);
  $('#ticker').innerHTML=`<span>${esc(S.ticker)}</span>`.repeat(6);
}

$('#app').addEventListener('click',async e=>{
  const copyBtn=e.target.closest('[data-copy]');
  if(copyBtn){
    const link=location.href.split('#')[0]+'#profile/'+copyBtn.dataset.copy;
    try{await navigator.clipboard.writeText(link);copyBtn.innerHTML=`${icon('check')} Copied`}
    catch{prompt('Copy this profile link:',link)}
    return;
  }
  const btn=e.target.closest('.vote-btns button');
  if(!btn)return;
  const tile=btn.closest('.tile');
  const p=S.board.find(x=>x.id===tile.dataset.id);
  if(!p)return;
  const status=tile.querySelector('.status');
  const isChad=btn.dataset.v==='c';
  const buttons=tile.querySelectorAll('button');

  if(localStorage.getItem(voteKey(p.id))){
    status.textContent='You have already voted on this contender.';
    buttons.forEach(b=>b.disabled=true);
    return;
  }
  buttons.forEach(b=>b.disabled=true);
  status.textContent='Sending vote…';

  try{
    let voter=localStorage.getItem('voter');
    if(!voter){voter=crypto.randomUUID();localStorage.setItem('voter',voter)}
    const res=await fetch('/api/vote',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contender:p.n,contenderId:p.id,verdict:isChad?'Chad':'Not Chad',poll:S.poll.q,pollId:S.poll.id,voterId:voter})
    });
    const data=await res.json().catch(()=>({}));
    if(res.status===409){localStorage.setItem(voteKey(p.id),btn.dataset.v)}
    else if(!res.ok)throw new Error(data.error||'Vote submission failed');
    else localStorage.setItem(voteKey(p.id),btn.dataset.v);
    if(data.tally)T[p.id]=data.tally;
    tile.outerHTML=tileHTML(p);
  }catch(error){
    console.error('Vote failed:',error);
    status.textContent='Could not send vote. Try again.';
    buttons.forEach(b=>b.disabled=false);
  }
});

/* Admin editor */
const dlg=$('#dlg');
const saveDraft=()=>localStorage.setItem('hcr_draft',JSON.stringify(S));

function openDialog(html,onSave){
  dlg.innerHTML=html+`<div class="dialog-actions">
    <button class="ghost" id="cancel">Cancel</button>
    <button id="save">${icon('check')} Save</button></div>`;
  dlg.showModal();
  $('#cancel').onclick=()=>dlg.close();
  $('#save').onclick=async()=>{
    await onSave();
    saveDraft();
    dlg.close();
    preload(allImages());
    route();
  };
}

const editorRow=p=>{
  p=p||{id:uid(),n:'',t:'',m:0,s:0,desc:'',img:''};
  return `<div class="editor-card" data-id="${p.id}">
    <div class="grid2"><input placeholder="Name" value="${esc(p.n)}"><input placeholder="Title" value="${esc(p.t)}"></div>
    <div class="grid3">
      <input type="number" placeholder="Move" title="Movement (+ up / - down)" value="${p.m}">
      <input type="number" placeholder="Score" title="Score out of 100" min="0" max="100" value="${p.s}">
      <input placeholder="Image URL (optional)" value="${esc(p.img)}">
    </div>
    <textarea rows="3" placeholder="Full description">${esc(p.desc)}</textarea>
    <div class="editor-foot"><span class="muted">ID: ${p.id}</span>
      <span>
        <button class="ghost" onclick="moveRow(this,-1)">${icon('up',14)}</button>
        <button class="ghost" onclick="moveRow(this,1)">${icon('down',14)}</button>
        <button class="ghost" onclick="this.closest('.editor-card').remove()">${icon('x',14)}</button>
      </span>
    </div>
  </div>`;
};

const moveRow=(btn,dir)=>{
  const row=btn.closest('.editor-card');
  const other=dir<0?row.previousElementSibling:row.nextElementSibling;
  if(other)dir<0?other.before(row):other.after(row);
};

const editBoard=()=>openDialog(`
  <h2>Leaderboard</h2>
  <p class="muted">Order = rank. Movement: + up, - down. Score is out of 100. IDs never change, so profile links and vote points stay attached.</p>
  <div id="rows">${S.board.map(editorRow).join('')}</div>
  <button class="ghost" onclick="document.querySelector('#rows').insertAdjacentHTML('beforeend',editorRow())">${icon('plus')} Add contender</button>`,
  ()=>{
    S.board=[...document.querySelectorAll('#rows .editor-card')].map(card=>{
      const f=card.querySelectorAll('input');
      return{id:card.dataset.id,n:f[0].value||'Unnamed',t:f[1].value,m:+f[2].value||0,s:Math.max(0,Math.min(100,+f[3].value||0)),img:f[4].value,desc:card.querySelector('textarea').value};
    });
  });

const newsRow=n=>`<div class="editor-card">
  <input placeholder="Headline" value="${esc(n.h)}">
  <textarea rows="3" placeholder="Body">${esc(n.b)}</textarea>
  <input placeholder="Image URL (optional)" value="${esc(n.img)}">
  <input placeholder="Date" value="${esc(n.d)}">
  <button class="ghost" onclick="this.closest('.editor-card').remove()">${icon('x',14)} Delete</button>
</div>`;

const editNews=()=>openDialog(`
  <h2>News</h2>
  <button class="ghost" onclick="document.querySelector('#newsList').insertAdjacentHTML('afterbegin',newsRow({h:'',b:'',img:'',d:new Date().toISOString().slice(0,10)}))">${icon('plus')} New post</button>
  <div id="newsList" style="margin-top:12px">${S.news.map(newsRow).join('')}</div>
  <label>Ticker text</label><input id="tickerInput" value="${esc(S.ticker)}">`,
  ()=>{
    S.news=[...document.querySelectorAll('#newsList .editor-card')].map(card=>{
      const f=card.querySelectorAll('input,textarea');
      return{h:f[0].value,b:f[1].value,img:f[2].value,d:f[3].value};
    }).filter(n=>n.h||n.b);
    S.ticker=$('#tickerInput').value;
  });

const editVote=()=>openDialog(`
  <h2>Vote section</h2>
  <p class="muted">Every contender appears as a tile with Chad / Not Chad buttons. Resetting starts a new poll with all points back at zero.</p>
  <label>Heading text</label><input id="pollQ" value="${esc(S.poll.q)}">
  <label style="display:flex;gap:8px;align-items:center;margin-top:14px">
    <input type="checkbox" id="pollReset" style="width:auto"> Reset votes and points (new poll)
  </label>`,
  ()=>{S.poll={id:$('#pollReset').checked?'p'+Date.now():S.poll.id,q:$('#pollQ').value}});

function exportSite(){
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#data').textContent=JSON.stringify(S,null,2).replace(/</g,'\\u003c');
  ['#app','#adminbar','#dlg','#ticker'].forEach(s=>{const el=clone.querySelector(s);if(el)el.innerHTML=''});
  const boot=clone.querySelector('#boot');if(boot){boot.className='';boot.style.cssText=''}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'}));
  a.download='hautlieuchadrankings.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function sha256(s){
  const data=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return btoa(String.fromCharCode(...new Uint8Array(data)));
}

async function initAdmin(){
  if(S.passHash){
    const pass=prompt('Admin passcode');
    if(!pass||(await sha256(pass))!==S.passHash)return;
  }else{
    const pass=prompt('First run: set an admin passcode');
    if(!pass)return;
    S.passHash=await sha256(pass);
  }
  const draft=localStorage.getItem('hcr_draft');
  if(draft){
    try{const d=JSON.parse(draft);d.passHash=S.passHash;S=d;normalise()}
    catch(error){console.error('Could not load admin draft:',error)}
  }
  isAdmin=true;
  saveDraft();
  $('#adminbar').innerHTML=`
    <button onclick="editBoard()">Leaderboard</button>
    <button onclick="editNews()">News</button>
    <button onclick="editVote()">Vote</button>
    <button class="ghost" onclick="exportSite()">${icon('download')} Export site</button>`;
  preload(allImages());
  route();
}

addEventListener('hashchange',route);

/* Boot: load every image (and the point tally) first, then reveal the site. */
(async()=>{
  const admin=/[?&]admin(?:[=&]|$)/.test(location.search);
  if(admin)await initAdmin();
  const jobs=[
    ['Rankings',withTimeout(preload(S.board.map(p=>p.img)),10000)],
    ['News',withTimeout(preload(S.news.map(n=>n.img)),10000)],
    ['Votes',withTimeout(loadTally(),10000)]
  ];
  for(const [label,job] of jobs){
    $('#bootmsg').textContent=`Loading ${label}…`;
    await Promise.all([job,new Promise(r=>setTimeout(r,350))]);
  }
  route();
  $('#boot').classList.add('done');
  setTimeout(()=>$('#boot').remove(),400);
})();
</script>
